name: CI

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Fails if gradle-wrapper.jar isn't an official Gradle release (supply-chain protection).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4

      # No TMDB key is needed: the app builds without one and tests use fake data.

      - name: Code style and static analysis
        run: ./gradlew ktlintCheck detekt

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Android lint
        run: ./gradlew lintDebug

      - name: Build debug and minified release
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kmovieapp-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
